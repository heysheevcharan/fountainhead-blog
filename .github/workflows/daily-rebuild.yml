name: Daily Rebuild

on:
  schedule:
    - cron: '0 0 * * *' # midnight UTC every day
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

permissions:
  contents: write # to commit new book years
  actions: write # needed by the keep-alive step

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Goodreads no longer exposes read dates, so record the year each new
      # book first appears on the "read" shelf.
      - name: Record years for newly read books
        run: node scripts/sync-book-years.mjs

      - name: Commit new book years
        run: |
          if git diff --quiet src/data/book-years.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record years for newly read books" src/data/book-years.json
          git push

      - name: Trigger Vercel deploy
        run: |
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      # GitHub disables scheduled workflows after 60 days without repo commits.
      # Re-enabling the workflow on every run resets that timer, so it never lapses.
      - name: Keep workflow alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-rebuild.yml/enable"
