backend:
  name: github
  repo: heysheevcharan/blog
  branch: main
  base_url: https://decap-proxy.sheevstartup.workers.dev

media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home Page
        file: src/content/pages/home.json
        fields:
          - label: Your Name
            name: name
            widget: string
          - label: Tagline
            name: tagline
            widget: string
            hint: "Shown below your name, e.g. 'software engineer · chennai'"
          - label: Bio
            name: bio
            widget: text
            hint: "Short paragraph about yourself"
          - label: Email
            name: email
            widget: string
            required: false
          - label: GitHub URL
            name: github
            widget: string
            required: false
          - label: X / Twitter URL
            name: twitter
            widget: string
            required: false
          - label: LinkedIn URL
            name: linkedin
            widget: string
            required: false
      - name: about
        label: About Page
        file: src/content/pages/about.json
        fields:
          - label: Body
            name: body
            widget: markdown
            hint: "Supports markdown — bold, links, headings etc."

  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: string
        hint: "Short summary shown in post lists and SEO meta tags (1-2 sentences)"
      - label: Publish Date
        name: pubDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: ""
      - label: Updated Date
        name: updatedDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: Cover Image
        name: image
        widget: image
        required: false
        hint: "Used for Open Graph / social sharing preview"
      - label: Tags
        name: tags
        widget: list
        required: false
        hint: "Comma-separated tags, e.g. engineering, life"
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: "Draft posts won't appear on the site"
      - label: Body
        name: body
        widget: markdown
