backend:
  name: github
  repo: heysheevcharan/blog
  branch: main
  base_url: https://decap-proxy.sheevstartup.workers.dev

media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: pages
    label: Pages
    folder: src/content/site-pages
    create: true
    delete: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - label: Page Title
        name: title
        widget: string
        hint: "Shown in the nav and as the page heading (e.g. 'about', 'projects')"
      - label: URL Slug
        name: slug
        widget: string
        hint: "URL path, e.g. /about or /projects (must start with /)"
      - label: Meta Description
        name: description
        widget: string
        required: false
        hint: "SEO description shown in Google results (120-155 characters)"
      - label: Show in Nav
        name: showInNav
        widget: boolean
        default: true
      - label: Nav Order
        name: navOrder
        widget: number
        default: 99
        hint: "Lower numbers appear first in the nav (home=1, blog=2, about=3)"
      - label: Your Name
        name: name
        widget: string
        required: false
        hint: "Home page only — your display name"
      - label: Tagline
        name: tagline
        widget: string
        required: false
        hint: "Home page only — shown below your name"
      - label: Email
        name: email
        widget: string
        required: false
        hint: "Home page only"
      - label: GitHub URL
        name: github
        widget: string
        required: false
        hint: "Home page only"
      - label: X / Twitter URL
        name: twitter
        widget: string
        required: false
        hint: "Home page only"
      - label: LinkedIn URL
        name: linkedin
        widget: string
        required: false
        hint: "Home page only"
      - label: Content
        name: body
        widget: markdown

  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: string
        hint: "Short summary shown in post lists and SEO meta tags (1-2 sentences)"
      - label: Publish Date
        name: pubDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: ""
      - label: Updated Date
        name: updatedDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: Cover Image
        name: image
        widget: image
        required: false
        hint: "Used for Open Graph / social sharing preview"
      - label: Tags
        name: tags
        widget: select
        required: false
        multiple: true
        hint: "Select all that apply. Can select multiple."
        options:
          - AI
          - LLMs
          - SaaS
          - b2b
          - books
          - business
          - classics
          - collaboration
          - company
          - contrarian
          - creativity
          - culture
          - curiosity
          - dating
          - design
          - distribution
          - empathy
          - entrepreneurship
          - experimentation
          - failure
          - freedom
          - hypothesis
          - intelligence
          - leadership
          - life
          - love
          - mimetic
          - momentum
          - morality
          - motivations
          - physics
          - play
          - politics
          - product
          - progress
          - psychology
          - purpose
          - religion
          - self-discovery
          - social
          - startups
          - story
          - storytelling
          - strategy
          - success
          - talent
          - taste
          - teams
          - thinking
          - time
          - truth
          - values
          - vibecoding
          - writing
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: "Draft posts won't appear on the site"
      - label: Body
        name: body
        widget: markdown
